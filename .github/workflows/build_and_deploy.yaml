name: SpringBoot CI/CD Pipeline

on:
  push:
    branches: [ "no-kafka" ]
  workflow_dispatch:


env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: ecommerce-cluster
  GKE_ZONE: asia-south1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false #all in-progress jobs are not canceled, when set to false
      matrix:
        service:
          - api-gateway
          - config-server
          - inventory-service
          - order-service

    steps:
      # 1. Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v6
      # 2. Set up java
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # 3. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username:  ${{ secrets.DOCKER_USERNAME }}
          password:  ${{ secrets.DOCKER_PATOKEN }}
      # 4. Build and push docker image, using Jib for each microservice
      - name: Build and Push ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run:
          ./mvnw clean package -DskipTests

  Deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: kubectl - Google Cloud GKE Cluster.
        uses: ameydev/gke-kubectl-action@master
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          APPLICATION_CREDENTIALS: ${{ secrets.GKE_SA_KEY }}
          CLUSTER_NAME: ${{ env.GKE_CLUSTER }}
          ZONE_NAME: ${{ env.GKE_ZONE }}
        with:
          args: apply -f k8s/