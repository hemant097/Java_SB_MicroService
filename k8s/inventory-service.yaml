apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: noviceanemone/ecommerce-learn-inventory-service:latest
          resources:
            limits:
              memory: "400Mi"
              cpu: "200m"
            requests:
              memory: "200Mi"
              cpu: "100m"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: DB_USER
              value: "user"
            - name: DB_PASSWORD
              value: "root"
            - name: DB_SERVICE
              value: "order-db-service"
            - name: CONFIG_SERVER_URL
              value: "http://config-service:8888"
          ports:
            - containerPort: 9010


---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 80
      targetPort: 9010
